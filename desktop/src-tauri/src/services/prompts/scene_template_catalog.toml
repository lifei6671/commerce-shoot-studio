default_rules = "使用暖色或同色系可控影棚背景、左前方美容盘主光和头发/肩线柔和轮廓光；画面具有刊头与短标题安全区，呈现专业编辑式妆发整理。"
variant_rules = "只选择一个变体执行。beauty-cover：近景人物、真实发光皮肤、商品靠近面部和自然精致妆发；fashion-cover：全身或 3/4 身、自信姿态、高时尚造型与有控制的戏剧光；fragrance-editorial：沉思姿态、香水瓶突出、暗色氛围背景和克制薄雾；minimal-editorial：干净白色影棚、无刊头、满版编辑图片。"
category_rules = "skincare：水润但真实的皮肤、商品位于下颌附近与美容光；fragrance：瓶身突出、沉思情绪与克制氛围；fashion：自信姿态、完整服装与戏剧光；jewelry：手部或颈部近景、奢华背景且无遮挡；haircare：头发作为视觉主体，突出运动与纹理；makeup：唇部或眼妆焦点、商品手持与编辑美妆。"
anti_ai_rules = "使用无品牌的中画幅或 85mm 人像镜头语言、自然景深、眼睛精准对焦、真实美容光、可见皮肤微纹理和织物局部锐度；禁止模仿真实杂志 Logo、名人脸、塑料皮肤、人体错误、过量烟雾和无意义奢华装饰。"
text_policy = "只执行用户确认的精确短标题；未提供文字时仅保留刊头和标题安全区，不渲染占位字符。禁止真实媒体商标、期号、可扫描条码和虚构采访。"
evidence_policy = "不得暗示真实媒体刊登、名人代言或品牌合作。"

