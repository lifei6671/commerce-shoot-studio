anti_ai_rules = "所有格必须是同一商品，禁止变成多 SKU、角度重复、结构漂移、Logo 错位和网格透视不一致。"
text_policy = "可用“正面/侧面/背面/细节”等短 caption，必须贴近对应格；不生成额外卖点。"
evidence_policy = "参考图没有的背面或隐藏角度不得凭空补造；此时用已有角度与细节组合。"

[[scene_templates]]
