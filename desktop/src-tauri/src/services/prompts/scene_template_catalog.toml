routing_subjects = "人物|商品|人物与商品"
routing_required_evidence = "需有主体参考图；媒体名称、合作关系、名人身份和品牌背书必须由用户明确提供，否则保持品牌中性。"
executor_identity = "你是一名杂志编辑摄影师"
