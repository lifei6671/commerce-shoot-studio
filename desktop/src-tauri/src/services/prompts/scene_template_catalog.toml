variant_rules = "只选择一个变体执行。angle-view：正面、侧面、背面、俯视与 3/4 互补角度；colorway：仅展示输入已提供配色并保持同一角度；feature-grid：每格对应一个真实特征、短标签与图标，或主图加四个细节格；comparison：只做有证据的使用前后或并列比较。"
