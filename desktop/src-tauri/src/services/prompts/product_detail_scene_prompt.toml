version 固定为 v1。
productSummary 必须由模型根据输入整理生成，不能原样复制系统规则或输出空值。
groups 按 viralStylesJson 中的风格顺序生成；如果 viralStylesJson 为空，生成一个 styleId 为 default、styleTitle 为 中性电商风格、colors 为 [] 的 group。
每个 group 必须包含非空 design_spec。design_spec 必须严格输出以下顺序和字段：
产品与卖点
产品：一句话商品描述。
卖点：2-4 个短词，用“ / ”分隔。
顾虑：2-4 个短词，用“ / ”分隔。
视觉重心：一句话说明视觉中心、核心展示方式和要打消的顾虑。

视觉定调
风格：一句话描述整体视觉方向。
色彩：一句话说明背景基调、强调色和产品原色保留。
字体：标题与正文的整体字体气质。
色温：全套统一色温。
光质：全套统一光质。
design_spec 必须结合商品卖点、目标平台、目标语言和当前 group 的爆款风格生成具体内容；禁止输出字段解释、占位句、空值、Markdown、编号列表、额外段落或 JSON 外文本。
items 按 modulesJson 中的模块顺序生成。
styleId、styleTitle、colors、moduleId、moduleTitle 必须沿用输入。
每个 item 必须包含 index，index 从 1 开始，按该 group 内模块顺序递增。
每个 item 必须包含 image_type，格式为“模块名称: 核心观点”。
image_type 的核心观点必须使用已选模块执行指令中的 image_type 生成指令，并从商品卖点中提炼具体购买理由、场景价值、外观结构、规格信息或已确认事实；禁止输出“核心价值”“差异优势”“卖点展示”“品质升级”等泛词。
每个 item 必须包含非空 image_prompt，这是下一步生图的不可见核心提示词。
每个 item 必须包含非空 copy_requirements，这是用户可查看、可修改的内容。
copy_requirements 只输出用户可编辑且需要进入画面的文字清单。必须包含主标题和目标语言；副标题与标注标签二选一，不能同时输出。画面如果存在明确可指向的商品局部、结构、动作点、规格、配件、SKU 或成分锚点，并且标注能提升理解，则输出标注标签并省略副标题；否则输出副标题并省略标注标签。主标题和副标题的排版、字体、位置、字号、颜色和安全边距必须融合到对应字段同一行。只有结构化信息或标注标签有实际内容时才输出；禁止输出“结构化信息: 不使用”“标注标签: 不使用”“缺失信息: 已足够”“文字生成要求”等空项或说明项；禁止原样返回“提炼一个最强购买理由”“补充使用场景或体验收益”“短标签文字”等模板占位句。
每个 item 必须包含 targetLanguage，且值必须等于目标语言：{{language}}。
每个 item 必须包含非空 sceneTitle，sceneTitle 是该场景的主标题，必须与 image_type 的核心观点一致。
缺失信息使用空数组 [] 或“需补充……”文本，不要返回 null。
textOverlay.headline 必须是短文案，并与 sceneTitle 语义一致；textOverlay.subheadline 可以为空字符串；textOverlay.tags 可以省略或返回空数组。
constraints 至少包含 3 条：一条事实/资质边界，一条合规风险，一条图片文字规则。
"""
