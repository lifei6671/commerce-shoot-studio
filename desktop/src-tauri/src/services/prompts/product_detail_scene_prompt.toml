标注 2: "短标签文字" -> 指向: 商品第二个可见细节。
标注 3: "短标签文字" -> 指向: 商品第三个可见细节。
线条样式: 细线或短折线，端点小圆点，线条颜色与背景有对比但不抢眼，标签文字放在商品外侧留白区。
