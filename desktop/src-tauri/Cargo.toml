[package]
name = "commerce-shoot-studio"
version = "0.1.0"
description = "商拍工坊桌面端"
authors = ["lifei6671"]
edition = "2021"

[lib]
name = "commerce_shoot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
