name: 桌面安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: 检出代码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 从标签准备应用版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="$(bash ./build/resolve-release-version.sh "${GITHUB_REF_NAME}")"
            printf '{"version":"%s"}\n' "${app_version}" > build/tauri-ci-version.json
          else
            printf '{}\n' > build/tauri-ci-version.json
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装 Rust 1.96.0 与目标架构
        run: >-
          rustup toolchain install 1.96.0
          --profile minimal
          --target ${{ matrix.target }}
          --no-self-update

      - name: 固定当前 Rust 工具链
        run: rustup default 1.96.0

      - name: 安装前端依赖
        run: npm ci --prefix desktop

      - name: 构建并上传安装包
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config ../build/tauri-ci-version.json
            --ci
            --no-sign
            -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: commerce-shoot-studio-unsigned-[platform]-[arch]-[bundle]

  release:
    name: 发布 GitHub Release
    needs: package
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: 检出发布脚本
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 下载全部安装包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: commerce-shoot-studio-unsigned-*
          path: release-artifacts
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/publish-github-release.sh release-artifacts
